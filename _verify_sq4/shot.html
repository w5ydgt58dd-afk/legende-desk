<!doctype html><html><head><meta charset=utf-8>
<style>html,body{margin:0;background:#000}</style></head>
<body>
<iframe id=f src="../index.html#tab=sq" style="border:0;width:430px;height:900px"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>{
  try{
    const d=f.contentDocument;
    const b=d.getElementById('t3');
    if(b) b.click();
  }catch(e){console.error(e)}
};
// also try after delay
setTimeout(()=>{try{f.contentDocument.getElementById('t3').click()}catch(e){}}, 2500);
</script>
</body></html>
