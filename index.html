<!doctype html><html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="manifest" href="manifest.json">
<title>Night Desk Terminal</title>
<style>
html,body{margin:0;background:#000;color:#fff;font:15px -apple-system,system-ui,sans-serif}
#boot{padding:40vh 20px;text-align:center;opacity:.5;font-size:13px}
</style>
</head>
<body>
<div id="boot">Chargement…</div>
<div class="hero" hidden><header><div class="logo">🦁</div><div><b>Legende Desk</b><small>memecoin terminal</small></div><span class="paper" id="mode">PAPER</span><span class="live" id="live">● Live</span></header>
<div class="ticker"><div id="tick"></div></div></div>
<div class="ndtabs-slot"></div>
<section id="home" hidden><div class="eqrow"><small id="eqlbl">Equity · départ $300</small><span class="mult" id="mult">1.00x</span></div>
<div id="bal">$300.00</div><div id="pnl"></div><canvas id="chart" height="150"></canvas>
<div class="card"><h3>Funnel <small id="fsum"></small></h3><div id="funnel"></div></div>
<div class="card" id="legSettingsCard"><h3>Réglages <small id="legSetSub">papier</small></h3><div id="legSettings" class="ndf-stats ndf-settings"></div></div>
<div class="card"><h3>Positions</h3><div id="pos"></div></div>
<div class="card"><h3>Activité live <small id="askip"></small></h3><div id="act" class="log"></div></div>
<div class="card"><h3>Historique des signaux <small id="hsum"></small></h3><div id="hist"></div></div>
<div class="card" id="journalcard"><h3>Journal <small id="jsum"></small></h3><div id="journal"></div></div>
<div class="card"><h3>Pourquoi les signaux ont été rejetés</h3><div id="skips"></div></div>
</section>
<section id="nd"></section>
<section id="coin" class="card" hidden><button onclick="show()">← Retour</button><h2 id="ctitle"></h2><canvas id="cchart" height="160"></canvas><div id="cbody"></div></section>
<script>
(function(){
  /* Durable cache bust: every open loads fresh CSS/JS; also kill any old SW */
  if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}
  if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}
  var v=Date.now();
  function css(h){var l=document.createElement('link');l.rel='stylesheet';l.href=h+'?_='+v;document.head.appendChild(l)}
  function js(h){return new Promise(function(res,rej){var s=document.createElement('script');s.src=h+'?_='+v;s.onload=res;s.onerror=rej;document.body.appendChild(s)})}
  css('app.css?v=sq3');
  js('chart.js').then(function(){return js('app.js?v=terminal-v1')}).then(function(){return js('nd.js?v=terminal-v1')}).then(function(){return js('sd.js?v=sq3')}).then(function(){
    var b=document.getElementById('boot'); if(b) b.remove();
  }).catch(function(e){var b=document.getElementById('boot'); if(b) b.textContent='Erreur de chargement — tirez pour rafraîchir'; console.error(e)});
})();
</script>
</body></html>
