<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#e8590c">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="manifest" href="manifest.json?v=10"><link rel="apple-touch-icon" href="icons/icon.svg"><link rel="stylesheet" href="app.css?v=10"><title>Legende Desk</title></head>
<body><div class="hero"><header><div class="logo">🦁</div><div><b>Legende Desk</b><small>memecoin terminal</small></div><span class="paper" id="mode">PAPER</span><span class="live" id="live">● Live</span></header>
<div class="ticker"><div id="tick"></div></div>
<section id="home"><div class="eqrow"><small id="eqlbl">Equity · départ $300</small><span class="mult" id="mult">1.00x</span></div>
<div id="bal">$300.00</div><div id="pnl"></div><canvas id="chart" height="150"></canvas>
<div class="card"><h3>Funnel <small id="fsum"></small></h3><div id="funnel"></div></div>
<div class="card"><h3>Positions</h3><div id="pos"></div></div>
<div class="card"><h3>Activité live <small id="askip"></small></h3><div id="act" class="log"></div></div>
<div class="card"><h3>Historique des signaux <small id="hsum"></small></h3><div id="hist"></div></div>
<div class="card" id="journalcard"><h3>Journal <small id="jsum"></small></h3><div id="journal"></div></div>
<div class="card"><h3>Pourquoi les signaux ont été rejetés</h3><div id="skips"></div></div>
</section>
<section id="coin" class="card" hidden><button onclick="show()">← Retour</button><h2 id="ctitle"></h2><canvas id="cchart" height="160"></canvas><div id="cbody"></div></section>
<script src="chart.js?v=10"></script><script src="app.js?v=10"></script><script src="nd.js?v=10"></script></body></html>
